name = "memos-worker"
compatibility_date = "2025-08-19"
main = "src/index.js"
[assets]
directory = "./src/public"
run_worker_first = [
	"/api/*"
]

[[d1_databases]]
binding = "DB"
database_id = "daf00097-ec9e-4ce0-aac9-e802668b1ea8"
database_name = "notes-db"

[[kv_namespaces]]
binding = "NOTES_KV"
id = "a5fa325d841544ccacd3b305839b9c0b"
preview_id = ""

[[r2_buckets]]
binding = "NOTES_R2_BUCKET"
bucket_name = "notes-r2-bucket"
preview_bucket_name = "notes-r2-bucket"
